CONFIG_MAIN_STACK_SIZE=6144
CONFIG_MAIN_THREAD_PRIORITY=2
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_RUNTIME_STATS=y

CONFIG_FPU=y
CONFIG_POLL=y
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_ZROS=y
CONFIG_ZROS_SHELL=y

CONFIG_LOG=y
# Deferred logging: a LOG call only packs a record into the ring below and
# returns, so no flight thread or ISR ever blocks on the console. A log storm
# can no longer stall the rate loop, the network stack, or the SD writer.
CONFIG_LOG_MODE_DEFERRED=y
# ~4 KiB holds roughly 80-130 packed records, enough to absorb normal multi-line
# bursts (arming, mode changes, GNSS events) without dropping. When a true storm
# outruns the 115200 console the overflow policy below drops the oldest record
# rather than blocking the producer.
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_MODE_OVERFLOW=y
# The log processing thread and the shell thread that drains records to the UART
# must both sit below every flight thread (rate 2, navigation 3, capture 4,
# planning 5, guidance 6, wire/gnss/serial 7) and below the SD writer (10), so
# console work can never preempt control or storage. 14 is the lowest
# application priority (K_LOWEST_APPLICATION_THREAD_PRIO with the default
# CONFIG_NUM_PREEMPT_PRIORITIES=15). Without CUSTOM_PRIORITY the log thread would
# still default to that lowest priority, but the shell thread defaults to 0
# (above the rate loop) and is the thread that actually writes the UART in
# deferred mode, so it must be pinned down explicitly.
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_PROCESS_THREAD_CUSTOM_PRIORITY=y
CONFIG_LOG_PROCESS_THREAD_PRIORITY=14
CONFIG_SHELL_THREAD_PRIORITY_OVERRIDE=y
CONFIG_SHELL_THREAD_PRIORITY=14
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_LOG_CMDS=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PRINTK=n

CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_SHELL_PROMPT_UART="rdd2:~$ "
CONFIG_SHELL_STACK_SIZE=6144
CONFIG_DEVICE_SHELL=y
CONFIG_KERNEL_SHELL=y

# The flight logger never formats a card: it refuses to log on an unformatted
# volume rather than destroy its contents. Drop the format-on-mount-failure
# path entirely so the behavior cannot regress. Inactive unless the FAT
# filesystem is compiled in, so this is a no-op for the passive image.
CONFIG_FS_FATFS_MOUNT_MKFS=n
