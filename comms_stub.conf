# Non-flyable communications/timing bench image.
CONFIG_RDD2_COMMS_STUB=y
# The system GNSS fix arrives through the direct Synapse wire receiver.
CONFIG_RDD2_GNSS_SOURCE_WIRE=y
# The passive endpoint has no periodic serial bridge thread.
CONFIG_RDD2_ZROS_SERIAL=n
CONFIG_RDD2_DSHOT=n
CONFIG_RDD2_LOCKSTEP=n
CONFIG_RDD2_FASTDYN=n
# The passive timing endpoint carries no SD stack: the flight logger and the
# usdhc/FAT block layer it selects stay out of the image so it remains lean.
CONFIG_RDD2_FLIGHT_LOG=n
