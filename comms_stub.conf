# Non-flyable communications/timing bench image.
CONFIG_RDD2_COMMS_STUB=y
# The tropic has no usable local sky view; the system GNSS fix arrives over the
# mesh from the rtk_gnss grandmaster (matches the board conf source selection).
CONFIG_RDD2_GNSS_SOURCE_MESH=y
CONFIG_RDD2_DSHOT=n
CONFIG_RDD2_LOCKSTEP=n
CONFIG_RDD2_FASTDYN=n
