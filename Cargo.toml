[workspace]
members = ["xtask"]
# Provisioned dependency checkouts (for example the synapse_fbs generator) are
# built under .devenv; keep their crates out of this workspace.
exclude = [".devenv"]
resolver = "3"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
