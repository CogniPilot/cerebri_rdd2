name: FastDyn mission

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RDD2_WEST_WORKSPACE: ${{ github.workspace }}/.west-workspace
  RDD2_MODELICA_MODELS_ROOT: ${{ github.workspace }}/.west-workspace/models/modelica_models

jobs:
  mission:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out RDD2
        uses: actions/checkout@v4

      - name: Configure runtime state
        run: echo "FASTDYN_STATE=$RUNNER_TEMP/fastdyn-state" >> "$GITHUB_ENV"

      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake device-tree-compiler git jq \
            libexpat1-dev libfdt-dev libglib2.0-dev libprotobuf-dev \
            libpixman-1-dev libssl-dev libudev-dev meson ninja-build pkg-config \
            protobuf-compiler python3-venv universal-ctags unzip zlib1g-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: cachix/install-nix-action@v31

      - name: Build RDD2 rehosting firmware
        run: |
          nix run .#west-update
          conf_file="$(realpath fastdyn/prj.conf)"
          overlay="$(realpath fastdyn/mr_vmu_tropic.overlay)"
          RDD2_BUILD_DIR="$PWD/build-mr_vmu_tropic-fastdyn" nix run .#build -- -p always -- \
            -DCONF_FILE="$conf_file" \
            -DDTC_OVERLAY_FILE="$overlay"

      - name: Build generic FastDyn runtime
        run: nix run .#fastdyn-setup

      - name: Test RDD2 mission adapter
        run: |
          cargo test --workspace --locked
          cargo build --release --locked --package cerebri-rdd2-xtask

      - name: Test native GPS mission ingress lifecycle
        run: nix run .#test-gps-lockstep

      - name: Export RDD2 FMI plant
        run: |
          MODELICA_MODELS_ROOT="$RDD2_MODELICA_MODELS_ROOT" \
            nix run "$RDD2_MODELICA_MODELS_ROOT#rdd2-export-plant"

          standard_zip="$RUNNER_TEMP/FMI-Standard-3.0.2.zip"
          standard_root="$RUNNER_TEMP/FMI-Standard-3.0.2"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://github.com/modelica/fmi-standard/releases/download/v3.0.2/FMI-Standard-3.0.2.zip \
            --output "$standard_zip"
          printf '%s  %s\n' \
            454a12f40069db7efc38faee1c8899fabe74086c0b052f88133b16f256c444bd \
            "$standard_zip" | sha256sum --check
          mkdir -p "$standard_root"
          unzip -q "$standard_zip" -d "$standard_root"

          plant_root="$RDD2_MODELICA_MODELS_ROOT/artifacts/vehicles/rdd2/plant"
          model_identifier="$(python3 - "$plant_root/modelDescription.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          interface = root.find("CoSimulation")
          if interface is None or not interface.get("modelIdentifier"):
              raise SystemExit("FMI model description has no CoSimulation modelIdentifier")
          print(interface.get("modelIdentifier"))
          PY
          )"
          binary_dir="$plant_root/binaries/x86_64-linux"
          mkdir -p "$binary_dir"
          cc -std=c99 -Wall -Wextra -Wpedantic -Werror -fPIC -shared \
            -DFMI3_OVERRIDE_FUNCTION_PREFIX=1 \
            -I"$standard_root/headers" \
            "$plant_root/sources/model.c" -lm \
            -o "$binary_dir/$model_identifier.so"
          printf 'RDD2_RUMOCA_PLANT_DESCRIPTION=%s\n' \
            "$plant_root/modelDescription.xml" >> "$GITHUB_ENV"
          printf 'RDD2_RUMOCA_PLANT_LIBRARY=%s\n' \
            "$binary_dir/$model_identifier.so" >> "$GITHUB_ENV"

      - name: Fly RDD2 mission
        env:
          RDD2_FASTDYN_BUILD_DIR: ${{ github.workspace }}/build-mr_vmu_tropic-fastdyn
        run: nix run .#fastdyn-ci

      - name: Upload mission artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdd2-fastdyn-mission
          path: artifacts/bil/**
          if-no-files-found: ignore
