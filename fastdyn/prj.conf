# Complete application profile for the rehosted firmware. Build with
# CONF_FILE=fastdyn/prj.conf so the physical sensor, console, storage, and
# network profile is not selected for the direct lockstep image.
CONFIG_MAIN_STACK_SIZE=6144
CONFIG_MAIN_THREAD_PRIORITY=2
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_THREAD_NAME=y
CONFIG_FPU=y
CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_POLL=y
CONFIG_HEAP_MEM_POOL_SIZE=32768

CONFIG_INPUT=y
CONFIG_INPUT_MODE_SYNCHRONOUS=y
CONFIG_SENSOR=y
CONFIG_ZROS=y

CONFIG_RDD2_FASTDYN=y
CONFIG_RDD2_LOCKSTEP=y
CONFIG_RDD2_GNSS_SOURCE_LOCKSTEP=y

# Optimize the 800 Hz controller for execution speed. QEMU supplies the CPU
# clock and does not emulate analog supply or PLL settling.
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_SIZE_OPTIMIZATIONS=n
CONFIG_ADJUST_DCDC=n
CONFIG_INIT_ARM_PLL=n
CONFIG_INIT_ENET_PLL=n

# FastDyn supplies deterministic entropy for this test-only image.
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TIMER_RANDOM_GENERATOR=y

# Every system-control register access (SysTick, MPU, PendSV) leaves the
# translated code and is served by the FastDyn device-model plugin, so a
# context switch that reprograms the time-slice timer and the MPU stack guard
# costs about ten such exits, and the 800 Hz control pipeline switches several
# times per tick. On the CI host the rehosted GNSS mission runs 1.3x real time
# with both, 2.7x without time slicing, and 3.7x without either. Neither
# changes what the flight processes compute: the rate, navigation, planning
# and guidance processes each run at their own priority and block on their
# inputs, so time slicing never arbitrates between them, and stack overflow
# detection is a hardware safety net the emulated image does not need.
CONFIG_TIMESLICING=n
CONFIG_HW_STACK_PROTECTION=n
