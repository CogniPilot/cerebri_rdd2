# ==============================================================================
#                      Inertial path: LPSPI3 + ICM45686 + GPIO3
# ==============================================================================
# LPSPI3 master (0x4039C000) driving the boardrunner SPI bus. The ICM45686 is
# attached as an elder SPI slave on PCS0. With CONFIG_SPI_NXP_LPSPI_DMA=n the
# driver uses the CPU-RTIO interrupt path; the model raises NVIC IRQ 34 for the
# TDF/RDF conditions and no eDMA channel is exercised for the 14-byte reads.
[Device.lpspi3]
ranges = [["0x4039c000", "0x4039c100"]]
irq = [[1, 150]]
description = "LPSPI3"
read_priority = "elder"
[[Device.lpspi3.handlers]]
model = "elder"
enabled = true
scroll = "boardrunner/boardrunner_sdk/build/lpspi3.so"
[[Device.lpspi3.slaves]]
device = "icm45686"
model = ["elder"]
cs_id = 0
device_scroll = "boardrunner/boardrunner_sdk/build/icm45686.so"

# GPIO3 (0x401C0000). The ICM45686 INT1/data-ready pin is wired to gpio3.18
# (int-gpios). The slave publishes that line on the signals bus; this model owns
# edge detection and raises the NVIC interrupt for GPIO3 pins 16..31 (IRQ 85).
[Device.gpio3]
ranges = [["0x401c0000", "0x401c0090"]]
irq = [[1, 150]]
description = "GPIO3"
read_priority = "elder"
[[Device.gpio3.handlers]]
model = "elder"
enabled = true
scroll = "boardrunner/boardrunner_sdk/build/gpio3.so"
[[Device.gpio3.connections]]
type = "endpoint"
name = "gazebo"
enabled = false

# FlexSPI controllers. The XIP image runs from FlexSPI2; the flash housekeeping
# path polls FLEXSPI_GetBusIdleStatus. With no boot ROM these are otherwise
# idle, so the models report the bus idle (STS0 ARBIDLE|SEQIDLE) and behave as a
# register file, letting the flight image progress past FlexSPI setup.
[Device.flexspi1]
ranges = [["0x402a8000", "0x402a8400"]]
irq = [[1, 150]]
description = "FlexSPI1"
read_priority = "elder"
[[Device.flexspi1.handlers]]
model = "elder"
enabled = true
scroll = "boardrunner/boardrunner_sdk/build/flexspi1.so"

[Device.flexspi2]
ranges = [["0x402a4000", "0x402a4400"]]
irq = [[1, 150]]
description = "FlexSPI2"
read_priority = "elder"
[[Device.flexspi2.handlers]]
model = "elder"
enabled = true
scroll = "boardrunner/boardrunner_sdk/build/flexspi2.so"

# ==============================================================================
#             LPI2C sensor buses (magnetometer / barometer)
# ==============================================================================
# The IST8310 (lpi2c1), and BMM350 + BMP390 (lpi2c4) sensors are not part of the
# inertial rehosting path. Their probes run at POST_KERNEL and, against an
# unmodelled controller, block boot (the MCUX RTIO transfer waits forever on a
# completion interrupt that never arrives). These stubs report the bus busy so
# the probes fail fast and boot proceeds to the shell and IMU path.
[Device.lpi2c1]
ranges = [["0x403f0000", "0x403f0180"]]
irq = [[1, 150]]
description = "LPI2C1"
read_priority = "elder"
[[Device.lpi2c1.handlers]]
model = "elder"
enabled = true
scroll = "boardrunner/boardrunner_sdk/build/lpi2c1.so"

[Device.lpi2c3]
ranges = [["0x403f8000", "0x403f8180"]]
irq = [[1, 150]]
description = "LPI2C3"
read_priority = "elder"
[[Device.lpi2c3.handlers]]
model = "elder"
enabled = true
scroll = "boardrunner/boardrunner_sdk/build/lpi2c3.so"

