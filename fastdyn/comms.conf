# Optional side-channel profile for Ethernet/Zenoh communication testing.
# Lockstep request/response pacing remains on direct shared memory.
CONFIG_NETWORKING=y
CONFIG_MDIO=y
CONFIG_CSYN_ZROS_BRIDGE=y
CONFIG_CSYN_ZENOH=y
CONFIG_CSYN_ZENOH_MODE="client"
CONFIG_CSYN_ZENOH_LOCATOR="udp/192.0.2.2:7447"
# The default posture is the TCP client, so this SITL side-channel selects the
# UDP unicast link explicitly for its udp/ peer locator. No multicast or
# scouting, so the native_sim build stays lean.
CONFIG_CSYN_ZENOH_POSTURE_UDP_UNICAST=y
