# Make the serial transport the publisher of the gnss_fix topic instead of the
# onboard reader, so the fix arrives over the radio. Redundant with the
# disabled devicetree node in mocap-gnss.overlay, which already makes the
# onboard choice unselectable, but stated explicitly so the intent is visible
# in the build config rather than implied by a node status.
CONFIG_RDD2_GNSS_SOURCE_RADIO=y

# Nothing else is needed to get the fix back as telemetry: the serial transport
# carries gnss outbound in every build, so an injected position is returned the
# same way an onboard one is.
