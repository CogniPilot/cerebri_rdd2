# Flip the gnss topic from onboard-produced (TX) to injected (RX). Redundant
# with the disabled devicetree node in mocap-gnss.overlay, which already makes
# the onboard choice unselectable, but stated explicitly so the intent is
# visible in the build config rather than implied by a node status.
CONFIG_RDD2_GNSS_SOURCE_RADIO=y

# With no onboard receiver and no estimator downstream of the fix, the injected
# position is the only one the vehicle holds, so without this a ground station
# gets no position telemetry at all in this build. Echoing it back also
# confirms the injected frame was accepted rather than counted as an error.
CONFIG_RDD2_CSYN_SERIAL_ECHO_KEY="gnss"
