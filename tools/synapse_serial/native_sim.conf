# Opt-in harness, pair with native_sim.overlay via EXTRA_CONF_FILE.
CONFIG_RDD2_CSYN_SERIAL=y

# The PTY has no real line rate, so there is no reason to decimate telemetry
# down to the SiK budget while testing the transport itself.
CONFIG_RDD2_CSYN_SERIAL_TX_MIN_INTERVAL_MS=100
