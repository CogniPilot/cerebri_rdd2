# Bench bring-up: kill the stub loop, immediate logs, and turn up the net/gPTP/PHY
# log levels so ENET + gPTP + zenoh bring-up is fully visible.
CONFIG_RDD2_STUB_LOOP_DISABLE=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_NET_L2_ETHERNET_LOG_LEVEL_DBG=y
CONFIG_PHY_LOG_LEVEL_DBG=y
CONFIG_NET_CONFIG_LOG_LEVEL_DBG=y
CONFIG_NET_CORE_LOG_LEVEL_DBG=y
CONFIG_NET_GPTP_LOG_LEVEL_DBG=y
