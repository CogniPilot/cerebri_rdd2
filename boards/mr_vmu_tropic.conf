CONFIG_INPUT=y
CONFIG_INPUT_MODE_SYNCHRONOUS=y
CONFIG_INPUT_SHELL=y
CONFIG_INPUT_EVENT_DUMP=y
CONFIG_INPUT_CRSF=y
CONFIG_INPUT_CRSF_SEND_SYNC=y
CONFIG_INPUT_CRSF_REPORT_FILTER=1
CONFIG_INPUT_CRSF_THREAD_PRIORITY=1
CONFIG_INPUT_CRSF_THREAD_STACK_SIZE=2048
CONFIG_INPUT_CRSF_USE_DTCM_FOR_DMA_BUFFER=y
CONFIG_CODE_DATA_RELOCATION=y
CONFIG_POSIX_API=y
CONFIG_MAX_PTHREAD_MUTEX_COUNT=16
CONFIG_MAX_PTHREAD_COND_COUNT=8

CONFIG_TRACING=y
CONFIG_SEGGER_SYSTEMVIEW=y
CONFIG_SEGGER_SYSTEMVIEW_BOOT_ENABLE=n
CONFIG_SEGGER_SYSVIEW_POST_MORTEM_MODE=n
CONFIG_SEGGER_SYSVIEW_APP_NAME="RDD2"
CONFIG_SEGGER_SYSVIEW_RTT_BUFFER_SIZE=16384
# Keep profiling focused on execution timing. Zephyr enables every tracing
# category by default, which overwhelms RTT on this high-rate application.
CONFIG_TRACING_SYSCALL=n
CONFIG_TRACING_WORK=n
CONFIG_TRACING_SEMAPHORE=n
CONFIG_TRACING_MUTEX=n
CONFIG_TRACING_CONDVAR=n
CONFIG_TRACING_QUEUE=n
CONFIG_TRACING_FIFO=n
CONFIG_TRACING_LIFO=n
CONFIG_TRACING_STACK=n
CONFIG_TRACING_MESSAGE_QUEUE=n
CONFIG_TRACING_MAILBOX=n
CONFIG_TRACING_PIPE=n
CONFIG_TRACING_HEAP=n
CONFIG_TRACING_MEMORY_SLAB=n
CONFIG_TRACING_TIMER=n
CONFIG_TRACING_EVENT=n
CONFIG_TRACING_POLLING=n
CONFIG_TRACING_PM=n
CONFIG_TRACING_NETWORKING=n

CONFIG_DSP=y
CONFIG_DSP_BACKEND_CMSIS=y
CONFIG_CMSIS_DSP=y

CONFIG_SENSOR=y
CONFIG_SENSOR_ASYNC_API=y
CONFIG_SENSOR_SHELL=y
# ICM45686 data-ready streaming for local inertial sensing. The early-boot
# fault (data-ready IRQ arriving before the RTIO stream is armed) and the
# uninitialised INT-config at driver init are both fixed in the fork driver.
CONFIG_ICM45686_STREAM=y
CONFIG_PINCTRL=y
CONFIG_CLOCK_CONTROL=y
CONFIG_DMA=y
CONFIG_MDIO=y
CONFIG_MDIO_SHELL=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
# IPv4-only: the TCP-client posture drops csyn's forced multicast link, so no
# IPv6 or MLD listener path is needed. Disable IPv6 to shed the dead stack.
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.58.0.15"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.0.0"
CONFIG_NET_SHELL=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_PER_INTERFACE=y
CONFIG_NET_STATISTICS_USER_API=y
CONFIG_NET_STATISTICS_IPV4=y
CONFIG_NET_STATISTICS_ICMP=y
CONFIG_NET_STATISTICS_UDP=y
CONFIG_NET_STATISTICS_ETHERNET=y
CONFIG_SPI_NXP_LPSPI_DMA=n
CONFIG_GNSS=y

# The system GNSS fix is received over the mesh from the rtk_gnss grandmaster
# instead of read off the local M10. The onboard receiver stays powered and its
# UART configured, but the mesh backend is the gnss_fix publisher on this node.
CONFIG_RDD2_GNSS_SOURCE_MESH=y

# Synapse topics over the SiK telemetry radio on the zros-serial alias.
CONFIG_RDD2_ZROS_SERIAL=y

# --- Mesh node on the T1ETH8 (10.58.0.0/16): gPTP time-receiver + zenoh via csyn ---
# The tropic joins the shared mesh as a static host; GNSS, corrections, and time
# arrive over the network rather than off local pins.
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="cerebri-vmu"

# gPTP (IEEE 802.1AS) static timeReceiver: the port is pinned to the receiver role
# and the classic-ENET PTP hardware clock is disciplined from received Sync/Follow_Up
# alone, so the VMU locks to the GNSS grandmaster through the Announce-less AVnu
# bridge. PTP_CLOCK is listed explicitly to keep the PHC in the build.
CONFIG_NET_GPTP=y
CONFIG_PTP_CLOCK=y
CONFIG_NET_GPTP_STATIC_TIME_RECEIVER=y

# zenoh-pico client transport carried by csyn, TCP to the desktop router. The
# TCP-client posture compiles only the TCP link (no UDP unicast, no multicast,
# no scouting), so the build carries no multicast-listener path and needs no
# IPv6 MLD support. Multi-threaded session servicing stays on for this build.
# The single-thread posture (CSYN_ZENOH_MULTI_THREAD=n) is a later hardening item.
CONFIG_CSYN_ZENOH=y
CONFIG_CSYN_ZENOH_MODE="client"
CONFIG_CSYN_ZENOH_LOCATOR="tcp/10.58.0.1:7447"
CONFIG_CSYN_ZENOH_POSTURE_TCP_CLIENT=y
CONFIG_ZVFS_OPEN_MAX=16
CONFIG_HEAP_MEM_POOL_SIZE=49152

# MCUboot-managed image with mcumgr OTA over UDP (fleet parity): confirm/rollback
# safety plus reflash over the mesh via mcumgr-client, so the tropic no longer
# depends on the J-Link for updates once it is on the network.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_ZCBOR=y
CONFIG_BASE64=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UDP=y
CONFIG_MCUMGR_TRANSPORT_UDP_IPV4=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_INFO=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_IMG_SLOT_INFO=y
